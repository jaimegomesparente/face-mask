[browser]
gatherUsageStats = false

[server]
headless = false
# Listen on the loopback interface only: the app must not be reachable from the network
address = "localhost"
port = 8501
maxUploadSize = 2048

[theme]
base = "dark"
primaryColor = "#c93b3b"
backgroundColor = "#0d0f12"
secondaryBackgroundColor = "#14171d"
textColor = "#e2e5eb"
font = "monospace"
